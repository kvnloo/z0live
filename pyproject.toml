[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "z0live"
version = "0.1.0"
description = "Session-scoped realtime conversation runtime for Zer0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
z0live = "z0live.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
