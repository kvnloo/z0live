[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "z0live"
version = "0.2.0"
description = "Portable realtime conversation runtime for Zer0"
requires-python = ">=3.10"
dependencies = ["websockets>=15,<17"]

[project.optional-dependencies]
openai = ["openai[realtime]>=3.8.0"]
test = ["pytest>=8.0"]

[project.scripts]
z0live = "z0live.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
