# M0-proven loopback binding. Rendered by config_yaml for the chosen ports.
port: __SIGNAL_PORT__
bind_addresses: ["127.0.0.1"]
rtc:
  node_ip: 127.0.0.1
  use_external_ip: false
  enable_loopback_candidate: true
  tcp_port: 0
  udp_port: __RTC_PORT__
  interfaces: {includes: ["lo0"]}
  ips: {includes: ["127.0.0.1/32"]}
room:
  auto_create: true
  empty_timeout: 300
logging:
  level: info
