name: z0live C1-ctx-sem-r3 soft budget rule (trimmed superseding line in the older slot, no static reservation) on blind r15 + blind v2 (sem-r3 vs r4, 2810), on gemma4-e2b Q4_K_M (CPU)
# C1-ctx-sem-r3 (C1/C2 context, track E). ONE change vs sem-r2: the hard static reservation is removed; a superseding
# line is trimmed to its value-bearing clause and placed in the slot of the older line it replaces (never longer than
# that line + 8 chars); otherwise r4 order. Keys, collision judge, cache: sem-r2's, unchanged. Arm B =
# brief_compress_sem3.compress_brief_sem3; A = bench/brief_compress_r4.py byte copy. PRIMARY = blind r15 (3 scenarios)
# + blind v2 (6 scenarios, bench/ctx_blind_v2.json), gates POOLED: update STALE / CORRECT (G1e), still-true pair old
# fact LOSS (G1), static recall (G1s); per-set counts report-only. Dev / no-regression sets: r14, r13, r12, recency, r8.
# Harness = bench/ctx_compress_sem_r3_eval.py; verdict = bench/ctx_compress_sem_r3_verdict.py (G8a brief-time wall
# p50 <= 3.0 s). Blocks B,A,B,A,O (main), B,A,B,A (r15, v2, dev). 36 jobs: 24 abab (3 scenarios x lo hi hx hy dw dx
# dy dz) + 12 v2 (6 scenarios x vx vy). Job timeouts <= 50 min (3000 s). Synthetic text only.
# Prereg: voice-adapter/bench/ctx-compress-sem-r3-PREREG.md
on:
  push:
    branches: [ci/ctx-sem-r3]
    paths: [".github/workflows/ctx-compress-sem-r3.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ctx-compress-sem-r3-${{ github.ref }}
  cancel-in-progress: false
env:
  LLAMA_TAG: b12527
  LLAMA_SHA256: c2758c87b9dd41293653e665fa3b06f5853d69243443d5d06d930683a55e35e4   # llama-b12527-bin-ubuntu-arm64.tar.gz
  REPO: unsloth/gemma-4-E2B-it-GGUF
  REV: 0314792d7f1f7e229411f620751375812bb9faf2
  FILE: gemma-4-E2B-it-Q4_K_M.gguf
  SHA: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8   # = HF LFS oid at REV
  BLOCKS_MAIN: "B,A,B,A,O"
  BLOCKS_PROBE: "B,A,B,A"
  BLOCKS_DEV: "B,A,B,A"
  TESTS: >-
    test_ctx_compress_r2_eval test_brief_compress_r2 test_brief_compress test_brief_compress_r3 test_brief_compress_r4
    test_ctx_compress_r5_gates test_brief_compress_r6 test_ctx_compress_r6 test_brief_compress_r7 test_ctx_compress_r8
    test_brief_compress_r9 test_ctx_compress_r9 test_ctx_compress_r10 test_brief_compress_r11 test_ctx_compress_r11
    test_ctx_compress_r12 test_ctx_compress_r13 test_ctx_compress_r14 test_ctx_compress_r15 test_ctx_compress_sem_r1
    test_ctx_compress_sem_r2 test_ctx_compress_sem_r3
jobs:
  abab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:   # longest jobs first (sem-r2 wall times); v2 = blind v2 scenarios 0-5 x probe halves vx / vy
        include:
          - {scenario: 0, half: dy}
          - {scenario: 1, half: dy}
          - {scenario: 2, half: dy}
          - {scenario: 0, half: dw}
          - {scenario: 1, half: dw}
          - {scenario: 2, half: dw}
          - {scenario: 0, half: dz}
          - {scenario: 1, half: dz}
          - {scenario: 2, half: dz}
          - {scenario: 0, half: lo}
          - {scenario: 1, half: lo}
          - {scenario: 2, half: lo}
          - {scenario: 0, half: hi}
          - {scenario: 1, half: hi}
          - {scenario: 2, half: hi}
          - {scenario: 0, half: hx}
          - {scenario: 1, half: hx}
          - {scenario: 2, half: hx}
          - {scenario: 0, half: hy}
          - {scenario: 1, half: hy}
          - {scenario: 2, half: hy}
          - {scenario: 0, half: vx}
          - {scenario: 1, half: vx}
          - {scenario: 2, half: vx}
          - {scenario: 3, half: vx}
          - {scenario: 4, half: vx}
          - {scenario: 5, half: vx}
          - {scenario: 0, half: vy}
          - {scenario: 1, half: vy}
          - {scenario: 2, half: vy}
          - {scenario: 3, half: vy}
          - {scenario: 4, half: vy}
          - {scenario: 5, half: vy}
          - {scenario: 0, half: dx}
          - {scenario: 1, half: dx}
          - {scenario: 2, half: dx}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner CPU / RAM / disk
        timeout-minutes: 2
        run: |
          set -euo pipefail
          lscpu | tee lscpu.txt
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "CPU_MODEL=${cpu:-unknown} ($(uname -m), $(nproc) cpus)" >> "$GITHUB_ENV"
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: llama.cpp ${{ env.LLAMA_TAG }} (prebuilt ubuntu arm64 CPU)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llama" && cd "$RUNNER_TEMP/llama"
          curl -fsSL --retry 5 --retry-all-errors -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-arm64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          tar xzf llama.tgz
          server=$(find "$RUNNER_TEMP/llama" -type f -name llama-server | head -1)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$server")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Restore GGUF cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models/${{ env.FILE }}
          key: gguf-${{ env.SHA }}
      - name: Download GGUF (pinned by sha256, 3 attempts)
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models"
          for i in 1 2 3; do
            if curl -fsSL --retry 5 --retry-all-errors --speed-limit 2000000 --speed-time 60 -o "$RUNNER_TEMP/models/$FILE" "https://huggingface.co/$REPO/resolve/$REV/$FILE" \
               && echo "$SHA  $RUNNER_TEMP/models/$FILE" | sha256sum -c -; then exit 0; fi
            echo "download attempt $i failed"; rm -f "$RUNNER_TEMP/models/$FILE"; sleep $((20 * i))
          done
          exit 1
      - name: Save GGUF cache
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/models/${{ env.FILE }}
          key: gguf-${{ env.SHA }}
      - name: Verify frozen inputs
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "$SHA  $RUNNER_TEMP/models/$FILE" | sha256sum -c -
          grep -E '^[0-9a-f]{64}  (voice-adapter|\.github)/' voice-adapter/bench/ctx-compress-sem-r3-FREEZE.sha256 | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: BABA bench sem-r3 (scenario ${{ matrix.scenario }} ${{ matrix.half }})
        timeout-minutes: 44
        env:
          HALF: ${{ matrix.half }}
          SC: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          python -m pip install --quiet "aiohttp>=3.9,<4"   # tiers.py imports aiohttp
          # set, probe indices, blocks, deadline (s) per harness run; dy runs two sets back to back
          case "$HALF" in
            lo) RUNS=("main 0,1,2,3 $BLOCKS_MAIN 2400") ;;
            hi) RUNS=("main 4,5,6,7 $BLOCKS_MAIN 2400") ;;
            # r15 probe groups = ctx_compress_r15_eval.R15_GROUPS (scenario 1 = car has 9 probes; test-checked)
            hx) if [ "$SC" = 1 ]; then P=0,1,2,3,4; else P=0,1,2,3; fi; RUNS=("r15 $P $BLOCKS_PROBE 2400") ;;
            hy) if [ "$SC" = 1 ]; then P=5,6,7,8; else P=4,5,6,7; fi; RUNS=("r15 $P $BLOCKS_PROBE 2400") ;;
            dw) RUNS=("r14 0,1,2,3,4,5,6 $BLOCKS_DEV 2400") ;;
            dx) RUNS=("r13 0,1,2,3,4 $BLOCKS_DEV 2400") ;;
            dy) RUNS=("recency 0,1,2 $BLOCKS_DEV 1150" "r8 0,1,2,5 $BLOCKS_DEV 1250") ;;
            dz) RUNS=("r12 0,1,2,3,4,5,6 $BLOCKS_DEV 2400") ;;
            vx|vy) P=$(cd voice-adapter/bench && python ctx_compress_sem_r3_eval.py --group "$SC" "$HALF"); RUNS=("v2 $P $BLOCKS_PROBE 2400") ;;
            *) echo "unknown half $HALF"; exit 1 ;;
          esac
          (cd voice-adapter && python -m unittest -v $TESTS)   # no model
          mkdir -p out
          cp lscpu.txt out/
          for run in "${RUNS[@]}"; do
            read -r SET PROBES BLOCKS DL <<< "$run"
            export BLOCKS
            python voice-adapter/bench/ctx_compress_sem_r3_eval.py --set "$SET" --dry --scenarios "$SC" | tee "out/dry-$SET.json"
            meta=$(python -c 'import json,os;print(json.dumps({k.lower():os.environ[k] for k in ("REPO","REV","FILE","SHA","LLAMA_TAG","CPU_MODEL","BLOCKS")}))')
            mkdir -p "out/logs-$SET"
            python voice-adapter/bench/ctx_compress_sem_r3_eval.py --set "$SET" --gguf "$RUNNER_TEMP/models/$FILE" --blocks "$BLOCKS" \
              --scenarios "$SC" --probes "$PROBES" --deadline-s "$DL" --meta "$meta" \
              --out "out/ctx-compress-sem-r3-s${SC}-${HALF}-${SET}.json" --logdir "out/logs-$SET"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctx-compress-sem-r3-s${{ matrix.scenario }}-${{ matrix.half }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  verdict:
    needs: abab
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ctx-compress-sem-r3-s*
          path: jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frozen sem-r3 verdict (pooled blind gates G1, G1e, G1s over r15 + v2; G1b, G1c, G2-G7, G8a)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          grep -E '^[0-9a-f]{64}  (voice-adapter|\.github)/' voice-adapter/bench/ctx-compress-sem-r3-FREEZE.sha256 | sha256sum -c -
          python -m pip install --quiet "aiohttp>=3.9,<4"   # presence() imports the harness (tiers.py imports aiohttp)
          mkdir -p out
          python voice-adapter/bench/ctx_compress_sem_r3_eval.py --presence > out/presence.json
          python voice-adapter/bench/ctx_compress_sem_r3_verdict.py $(find jobs -name 'ctx-compress-sem-r3-s*.json' | sort) | tee out/verdict.json
          { echo '```'; jq '{outcome, failed, checks, null_reasons, band, aa_flips, bb_flips, pooled, per_blind_set: (.per_blind_set | map_values({two_old_loss, update_stale, update_correct, static_recall, current_value_in_brief})), r14_a3_loss, dev_fm_loss, stale, unique_recall, invented_present, latency: .latency.p50_arm, sem_latency, sem_key_disagree_B1_B2, recall: .main_r2.recall}' out/verdict.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctx-compress-sem-r3-verdict
          path: out/
          retention-days: 30
