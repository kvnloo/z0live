name: Desktop broker

on:
  push:
    paths: ['desktop/**', 'bin/z0live', 'deploy/**', '.github/workflows/desktop.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Check for relevant changes
        id: changed
        run: |
          changed_files="$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} 2>/dev/null || echo '')"
          if echo "$changed_files" | grep -qE '^desktop/|^bin/z0live|^deploy/|^/.github/workflows/desktop.yml'; then
            echo "relevant=true" >> $GITHUB_OUTPUT
          else
            echo "relevant=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install QR encoder and decoder
        if: steps.changed.outputs.relevant == 'true'
        run: sudo apt-get update && sudo apt-get install -y qrencode zbar-tools

      - name: Compile desktop
        if: steps.changed.outputs.relevant == 'true'
        run: python -m compileall -q desktop

      - name: Run stdlib tests
        if: steps.changed.outputs.relevant == 'true'
        run: python -m unittest discover -s desktop/tests -v

      - name: Report result
        run: echo "stdlib-tests done"
