name: z0live barge-in A-bargein-Y, arm Y (two-cue ERLE-drop adaptation freeze) vs arm U on fresh seeds 33000-33095 (S1, S0, FULL; CPU, stdlib)
# A-bargein-Y: one change on top of arm X (bargein_replay/21, offline virtual-time sim, Python stdlib only, no network,
# no secrets). Arm Y = arm X whose adaptation freeze also needs the packet's capture energy to exceed the canceller's
# own a-priori echo prediction (current filter applied to the render) by more than --twocue-db, so an ERLE dip on
# echo alone no longer freezes. No speech, onset or commit rule changes. This branch reuses the registered
# text-climb.yml file name so `gh workflow run text-climb.yml --ref <branch>` can dispatch it.
# --only-arms U,Y skips the arms O, Q, S and X (A and B always run); unit-tested not to change the arms that run.
# Seeds 33000-33095 (never used before), two seeds per shard (matrix value = first seed, the shard runs first..+1),
# 48 shards in seed order, so the first shards (holding the local-recompute seeds 33000 and 33004) start first.
# Three conditions per shard as parallel processes: S1 quiet caller (--caller-level-db-range -10,0) -> out/s1,
# S0 unstressed -> out/s0, FULL (S1 + --erl-db-range 0,6) -> out/full. No holdout seed in this slot.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seeds ${{ matrix.first }}+1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        first: [33000, 33002, 33004, 33006, 33008, 33010, 33012, 33014, 33016, 33018, 33020, 33022,
                33024, 33026, 33028, 33030, 33032, 33034, 33036, 33038, 33040, 33042, 33044, 33046,
                33048, 33050, 33052, 33054, 33056, 33058, 33060, 33062, 33064, 33066, 33068, 33070,
                33072, 33074, 33076, 33078, 33080, 33082, 33084, 33086, 33088, 33090, 33092, 33094]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 55
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set -euo pipefail
          cd voice-adapter
          seeds="$FIRST-$((FIRST + 1))"
          common=(--seeds "$seeds" --jobs 2 --echo-model residual --echo-continuous
                  --bot-render recorded --rhos none --energy-k-db -12 --energy-min-speech-ms 30
                  --resid-threshold 1360 --arm-o --guard-erle-db 6 --guard-margin-db 3 --guard-packets 5
                  --arm-q --duck-commit-ms 100 --duck-window-ms 300 --arm-s --prearm-rms 5000 --arm-u
                  --arm-x --dtfreeze-db 8 --arm-y --twocue-db 1 --only-arms U,Y)
          t0=$(date +%s)
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s1 --caller-level-db-range=-10,0 > ../s1.log &
          p1=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s0 > ../s0.log &
          p0=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/full \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 > ../full.log &
          p2=$!
          rc=0
          wait $p1 || rc=1
          wait $p0 || rc=1
          wait $p2 || rc=1
          for c in s1 s0 full; do sed "s/^/$c /" "../$c.log" | tee -a "$GITHUB_STEP_SUMMARY"; done
          echo "sweep wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.first }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls s1/seed-*.json s0/seed-*.json full/seed-*.json | wc -l && sha256sum s1/seed-*.json s0/seed-*.json full/seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum s1/seed-*.json s0/seed-*.json full/seed-*.json)
