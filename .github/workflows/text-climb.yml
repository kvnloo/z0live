name: z0live barge-in energy-gate sweep (CPU, stdlib)
# A-bargein-F: this branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml
# --ref <branch>` can dispatch it (a new workflow file is not dispatchable until it is on the default branch).
# It runs voice-adapter/bench/bargein_sweep.py with --echo-model residual --bot-render recorded --arm-d
# (bargein_replay/4, offline virtual-time sim, Python stdlib only, no network, no secrets) on holdout seed 44
# and fresh seeds 3000-3039: arms A, B, C rho 0.9 at M 40 ms, D (energy gate k -12 dB, M 30 ms, picked on
# dev seed 43).
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seeds ${{ matrix.seeds }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seeds: ["44", 3000-3001, 3002-3003, 3004-3005, 3006-3007, 3008-3009, 3010-3011, 3012-3013, 3014-3015,
                3016-3017, 3018-3019, 3020-3021, 3022-3023, 3024-3025, 3026-3027, 3028-3029, 3030-3031,
                3032-3033, 3034-3035, 3036-3037, 3038-3039]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 17
        env:
          SEEDS: ${{ matrix.seeds }}
        run: |
          set -euo pipefail
          cd voice-adapter
          python -B bench/bargein_sweep.py --seeds "$SEEDS" --out ../out --jobs "$(nproc)" \
            --echo-model residual --bot-render recorded --rhos 0.9 \
            --arm-d --energy-k-db -12 --energy-min-speech-ms 30 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.seeds }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls seed-*.json | wc -l && sha256sum seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum seed-*.json)
