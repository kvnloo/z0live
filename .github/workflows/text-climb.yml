name: z0live barge-in A-bargein-AE, arm UC (arm U + residual/echo-estimate coherence veto) vs arm U, --clip-set multi, fresh seeds (S1, S0, FULL; CPU, stdlib)
# A-bargein-AE: one change on the trigger side (bargein_replay/25, offline virtual-time sim, Python stdlib only, no
# network, no secrets). Arm UC = arm U except that an armed packet U calls speech is vetoed when the coherence rho
# between the canceller residual and the canceller's own echo estimate (20 ms, max over lags +-2 ms) is >=
# --rho-veto. The veto never adds speech and never acts before arming. Default bytes unchanged.
# This branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml --ref <branch>` can
# dispatch it.
# input set=main: sweep seeds 38000-38039 + holdout seeds 38500-38515, two seeds per shard, 28 shards, max-parallel 7.
# input set=aa: an independent A/A dispatch of seeds 38000-38007 (4 shards, max-parallel 1); 7 + 1 <= 8 jobs.
# Three conditions per shard as parallel processes: S1 quiet caller (--caller-level-db-range -10,0) -> out/s1,
# S0 unstressed -> out/s0, FULL (S1 + --erl-db-range 0,6) -> out/full.
# Step timeout 42 min = 4 x the local serial single-core probe of one shard's work (6 x ~104 s).
on:
  workflow_dispatch:
    inputs:
      set:
        description: "main (38000-38039 + 38500-38515) or aa (A/A re-run of 38000-38007)"
        required: true
        default: main
        type: choice
        options: [main, aa]
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seeds ${{ matrix.first }}+1
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.set == 'aa' && 1 || 7 }}
      matrix:
        first: ${{ fromJSON(inputs.set == 'aa' && '[38000,38002,38004,38006]' || '[38000,38002,38004,38006,38008,38010,38012,38014,38016,38018,38020,38022,38024,38026,38028,38030,38032,38034,38036,38038,38500,38502,38504,38506,38508,38510,38512,38514]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep
        timeout-minutes: 42
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set -euo pipefail
          echo "runner: $(nproc) cpus, $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          cd voice-adapter
          seeds="$FIRST-$((FIRST + 1))"
          common=(--seeds "$seeds" --jobs 2 --echo-model residual --echo-continuous --bot-render recorded
                  --clip-set multi --rhos none --energy-k-db -12 --energy-min-speech-ms 30 --resid-threshold 1360
                  --arm-o --guard-erle-db 6 --guard-margin-db 3 --guard-packets 5 --arm-q --duck-commit-ms 100
                  --duck-window-ms 300 --arm-s --prearm-rms 5000 --arm-u --arm-uc --rho-veto 0.8 --only-arms U,UC)
          t0=$(date +%s)
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s1 --caller-level-db-range=-10,0 > ../s1.log &
          p1=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s0 > ../s0.log &
          p0=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/full \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 > ../full.log &
          p2=$!
          rc=0
          wait $p1 || rc=1
          wait $p0 || rc=1
          wait $p2 || rc=1
          for c in s1 s0 full; do sed "s/^/$c /" "../$c.log" | tee -a "$GITHUB_STEP_SUMMARY"; done
          echo "sweep wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.first }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
