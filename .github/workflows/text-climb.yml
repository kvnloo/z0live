name: z0live text climb (CPU llama.cpp)
# Scores small GGUF lane models on z0live's frozen SLM lane suites (slm-v1, slm-v2, slm-v2 model-compressed brief)
# with the vendored z0live slm_bench logic (voice-adapter/slm_bench.py). Synthetic suites only, no owner data.
on:
  # push on this branch, or `gh workflow run <file> --ref <this branch>` (works without the file on main)
  push:
    branches: [ci/text-climb]
    paths: [".github/workflows/text-climb.yml", "voice-adapter/bench/ghci/**"]
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: text-climb-${{ github.ref }}
  cancel-in-progress: false
env:
  LLAMA_TAG: b12527            # same llama.cpp build as the Studio bench (slm_bench default)
  LLAMA_SHA256: c2758c87b9dd41293653e665fa3b06f5853d69243443d5d06d930683a55e35e4   # llama-b12527-bin-ubuntu-arm64.tar.gz
jobs:
  bench:
    name: ${{ matrix.cfg.model }} ${{ matrix.cfg.quant }} ${{ matrix.brief }}
    runs-on: ubuntu-24.04-arm   # GitHub arm64 runner: one CPU family per job (x64 pool mixes Intel/AMD, GH4)
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # GH13: cut to the decision arms/cells (full, half, odd, es2 x gemma4-e2b) to save runner minutes;
        # earlier briefs: compressed, medium, e5, es4; earlier cfgs: qwen3-0.6b / qwen3-1.7b Q4_K_M, Q8_0 (see GH12 branch).
        brief: [full, half, odd, es2]   # es2 = slm-v2-es2: even with pair 2 swapped for pair 5 in place (GH13); medium = slm-v2-chat1k: chat header + 6 fact turns + status (GH8); half = slm-v2-half: full brief, 6 of 12 filler pairs (GH9); odd = slm-v2-odd: the other 6 (GH10); e5 = slm-v2-e5: even minus pair 0 (GH11); es4 = slm-v2-es4: even with pair 4 swapped for pair 1 in place (GH12)
        cfg:
          - {model: gemma4-e2b, quant: Q4_K_M, repo: unsloth/gemma-4-E2B-it-GGUF, file: gemma-4-E2B-it-Q4_K_M.gguf, sha: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8, cache: true}
          - {model: gemma4-e2b, quant: Q8_0, repo: unsloth/gemma-4-E2B-it-GGUF, file: gemma-4-E2B-it-Q8_0.gguf, sha: 605d3c2647d7c58c1e4b5375ccb5702acf94c2611b4c8d4877812f8fdd32d053, cache: false}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner CPU (lscpu)
        timeout-minutes: 2
        run: |
          set -euo pipefail
          lscpu
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "CPU_MODEL=${cpu:-unknown} ($(uname -m), $(nproc) cpus)" >> "$GITHUB_ENV"
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: llama.cpp ${{ env.LLAMA_TAG }} (prebuilt ubuntu arm64 CPU)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llama" && cd "$RUNNER_TEMP/llama"
          curl -fsSL -o llama.tgz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-arm64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tgz" | sha256sum -c -
          tar xzf llama.tgz
          server=$(find "$RUNNER_TEMP/llama" -type f -name llama-server | head -1)
          test -x "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$server")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          nproc; free -g; df -h "$RUNNER_TEMP" | tail -1
      - name: Restore GGUF cache
        if: matrix.cfg.cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/models/${{ matrix.cfg.file }}
          key: gguf-${{ matrix.cfg.sha }}
      - name: Download GGUF (pinned by sha256)
        timeout-minutes: 15   # a stalled HF transfer hung a 5 GB download for 50 min (run 45002207090)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REPO: ${{ matrix.cfg.repo }}
          FILE: ${{ matrix.cfg.file }}
          SHA: ${{ matrix.cfg.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 5 --retry-all-errors --speed-limit 2000000 --speed-time 60 -o "$RUNNER_TEMP/models/$FILE" "https://huggingface.co/$REPO/resolve/main/$FILE"
          echo "$SHA  $RUNNER_TEMP/models/$FILE" | sha256sum -c -
      - name: Save GGUF cache
        if: matrix.cfg.cache && steps.cache.outputs.cache-hit != 'true' && matrix.brief == 'full'
        continue-on-error: true   # a parallel job may have saved the same key first
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/models/${{ matrix.cfg.file }}
          key: gguf-${{ matrix.cfg.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bench
        timeout-minutes: 40
        env:
          MODEL: ${{ matrix.cfg.model }}
          QUANT: ${{ matrix.cfg.quant }}
          REPO: ${{ matrix.cfg.repo }}
          FILE: ${{ matrix.cfg.file }}
          BRIEF: ${{ matrix.brief }}
        run: |
          set -euo pipefail
          python -m pip install --quiet "aiohttp>=3.9,<4"   # tiers.py imports aiohttp.ClientTimeout
          case "$BRIEF" in full) SUITES=slm-v1,slm-v2 ;; medium) SUITES=slm-v2-chat1k ;; half) SUITES=slm-v2-half ;; odd) SUITES=slm-v2-odd ;; e5) SUITES=slm-v2-e5 ;; es4) SUITES=slm-v2-es4 ;; es2) SUITES=slm-v2-es2 ;; *) SUITES=slm-v2-model1100 ;; esac
          mkdir -p out
          meta=$(python -c 'import json,os;print(json.dumps({k.lower():os.environ[k] for k in ("MODEL","QUANT","REPO","FILE","BRIEF","CPU_MODEL")}))')
          Z0_VENDOR=voice-adapter python voice-adapter/bench/ghci/ci_bench.py --gguf "$RUNNER_TEMP/models/$FILE" --name "$MODEL-$QUANT" --suites "$SUITES" \
            --meta "$meta" --out "out/$MODEL-$QUANT-$BRIEF.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.cfg.model }}-${{ matrix.cfg.quant }}-${{ matrix.brief }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: Table
        run: |
          python3 voice-adapter/bench/ghci/summarize.py results summary-out > /dev/null
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; cat summary-out/summary.md; } >> "$GITHUB_STEP_SUMMARY"
          cat summary-out/summary.md
        env:
          NOTE: ${{ inputs.note }}
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary-out/
          retention-days: 30
