name: z0live barge-in one-flag stress split (CPU, stdlib)
# A-bargein-H: this branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml
# --ref <branch>` can dispatch it (a new workflow file is not dispatchable until it is on the default branch).
# It runs voice-adapter/bench/bargein_sweep.py with --echo-model residual --bot-render recorded --arm-d
# (bargein_replay/5, offline virtual-time sim, Python stdlib only, no network, no secrets) on holdout seed 47
# and fresh seeds 5000-5039 under two one-flag stress conditions: S1 caller-only (--caller-level-db-range
# -10,0, default ERL) -> out/s1, and S2 ERL-only (--erl-db-range 0,6, caller at 0 dB) -> out/s2. Arms A, B,
# C rho 0.9 at M 40 ms, D frozen (k -12 dB, M 30 ms). No harness code change.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seeds ${{ matrix.seeds }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seeds: ["47", 5000-5001, 5002-5003, 5004-5005, 5006-5007, 5008-5009, 5010-5011, 5012-5013, 5014-5015,
                5016-5017, 5018-5019, 5020-5021, 5022-5023, 5024-5025, 5026-5027, 5028-5029, 5030-5031,
                5032-5033, 5034-5035, 5036-5037, 5038-5039]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 36
        env:
          SEEDS: ${{ matrix.seeds }}
        run: |
          set -euo pipefail
          cd voice-adapter
          python -B bench/bargein_sweep.py --seeds "$SEEDS" --out ../out/s1 --jobs "$(nproc)" \
            --echo-model residual --bot-render recorded --rhos 0.9 \
            --arm-d --energy-k-db -12 --energy-min-speech-ms 30 \
            --caller-level-db-range=-10,0 | sed 's/^/s1 /' | tee -a "$GITHUB_STEP_SUMMARY"
          python -B bench/bargein_sweep.py --seeds "$SEEDS" --out ../out/s2 --jobs "$(nproc)" \
            --echo-model residual --bot-render recorded --rhos 0.9 \
            --arm-d --energy-k-db -12 --energy-min-speech-ms 30 \
            --erl-db-range=0,6 | sed 's/^/s2 /' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.seeds }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls s1/seed-*.json s2/seed-*.json | wc -l && sha256sum s1/seed-*.json s2/seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum s1/seed-*.json s2/seed-*.json)
