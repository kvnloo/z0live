name: z0live barge-in A-bargein-AB, arm Z2 (arm Z + longer run for floor-only packets) vs arm U, --clip-set multi, fresh seeds 36000-36095 (S1, S0, FULL; CPU, stdlib)
# A-bargein-AB: one change on the onset side (bargein_replay/24, offline virtual-time sim, Python stdlib only, no
# network, no secrets). Arm Z2 = arm Z (A-bargein-AA: arm U plus a floor-relative onset level rule, --floor-rms 1100
# --floor-k-db 12) except that floor-only packets (speech by the floor rule, not by U's rule) count for the onset
# and the commit only inside a consecutive speech run >= --floor-min-run-ms 40; U-speech packets keep U's rule.
# Default bytes unchanged. This branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml --ref
# <branch>` can dispatch it.
# input set=main: seeds 36000-36095, two seeds per shard, 48 shards, max-parallel 6.
# input set=aa: an independent A/A dispatch of seeds 36000-36031 (16 shards, max-parallel 2); 6 + 2 <= 8 jobs.
# Three conditions per shard as parallel processes: S1 quiet caller (--caller-level-db-range -10,0) -> out/s1,
# S0 unstressed -> out/s0, FULL (S1 + --erl-db-range 0,6) -> out/full.
on:
  workflow_dispatch:
    inputs:
      set:
        description: "main (36000-36095) or aa (A/A re-run of 36000-36031)"
        required: true
        default: main
        type: choice
        options: [main, aa]
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seeds ${{ matrix.first }}+1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.set == 'aa' && 2 || 6 }}
      matrix:
        first: ${{ fromJSON(inputs.set == 'aa' && '[36000,36002,36004,36006,36008,36010,36012,36014,36016,36018,36020,36022,36024,36026,36028,36030]' || '[36000,36002,36004,36006,36008,36010,36012,36014,36016,36018,36020,36022,36024,36026,36028,36030,36032,36034,36036,36038,36040,36042,36044,36046,36048,36050,36052,36054,36056,36058,36060,36062,36064,36066,36068,36070,36072,36074,36076,36078,36080,36082,36084,36086,36088,36090,36092,36094]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sweep
        timeout-minutes: 40
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set -euo pipefail
          echo "runner: $(nproc) cpus, $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          cd voice-adapter
          seeds="$FIRST-$((FIRST + 1))"
          common=(--seeds "$seeds" --jobs 2 --echo-model residual --echo-continuous --bot-render recorded
                  --clip-set multi --rhos none --energy-k-db -12 --energy-min-speech-ms 30 --resid-threshold 1360
                  --arm-o --guard-erle-db 6 --guard-margin-db 3 --guard-packets 5 --arm-q --duck-commit-ms 100
                  --duck-window-ms 300 --arm-s --prearm-rms 5000 --arm-u --arm-z --floor-rms 1100 --floor-k-db 12
                  --arm-z2 --floor-min-run-ms 40 --only-arms U,Z2)
          t0=$(date +%s)
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s1 --caller-level-db-range=-10,0 > ../s1.log &
          p1=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s0 > ../s0.log &
          p0=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/full \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 > ../full.log &
          p2=$!
          rc=0
          wait $p1 || rc=1
          wait $p0 || rc=1
          wait $p2 || rc=1
          for c in s1 s0 full; do sed "s/^/$c /" "../$c.log" | tee -a "$GITHUB_STEP_SUMMARY"; done
          echo "sweep wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.first }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
