name: z0live barge-in A-bargein-AD, coherence cue dev diagnostic (no arm), arm U, dev seeds 37000-37031 (S1, S0; CPU, stdlib)
# A-bargein-AD: zero-arm dev diagnostic (bargein_replay/24, offline virtual-time sim, Python stdlib only, no network,
# no secrets). bench/bargein_ad_coherence.py runs arm U with bookkeeping only (no decision change) and writes, per
# 10 ms packet of the S1 slow-or-missed onset set and the S0 false-cut / duck-false-alarm trigger set, the coherence
# rho = |<e, y_hat>| / (||e|| ||y_hat||) between the NLMS residual e and the echo estimate y_hat (20 ms window, max
# over lags -8..+8 at 4 kHz), its zero-lag value and the mic-vs-y_hat coherence. Default bytes unchanged.
# This branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml --ref <branch>` can
# dispatch it. 8 shards x 4 seeds, two conditions each (S1 quiet caller --caller-level-db-range -10,0; S0 unstressed),
# 200 trials per seed and condition, max-parallel 8. Each shard also checks the plain CLI sha256 of its first seed
# against the instrumented run (instrumentation must not change any decision).
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  cues:
    name: seeds ${{ matrix.first }}+3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        first: [37000, 37004, 37008, 37012, 37016, 37020, 37024, 37028]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cues
        timeout-minutes: 35
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set -euo pipefail
          echo "runner: $(nproc) cpus, $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          cd voice-adapter
          t0=$(date +%s)
          for s in $(seq "$FIRST" $((FIRST + 3))); do for c in s1 s0; do echo "$s $c"; done; done \
            | xargs -P "$(nproc)" -L 1 sh -c 'python -B bench/bargein_ad_coherence.py "$0" "$1" ../out 200' \
            > ../cues.log
          tee -a "$GITHUB_STEP_SUMMARY" < ../cues.log
          echo "wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(ls ../out/*.tsv | wc -l)" = 8
      - name: Plain CLI sha check (first seed of the shard, S1 and S0)
        timeout-minutes: 15
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set -euo pipefail
          cd voice-adapter
          base="--echo-model residual --echo-continuous --bot-render recorded --clip-set multi --energy-k-db=-12.0
            --energy-min-speech-ms 30 --nlms-mu 0.5 --nlms-delta 1000.0 --nlms-pre-ms 15 --nlms-post-ms 65
            --nlms-geigel 0.5 --nlms-hang-ms 30 --nlms-min-updates 10 --nlms-margin-db=6.0 --nlms-converged-db=6.0
            --resid-threshold 1360.0 --resid-arm-db=6.0 --resid-nlp-db=3.0 --arm-o --guard-erle-db=6.0
            --guard-margin-db=3.0 --guard-packets 5 --arm-q --duck-commit-ms 100 --duck-window-ms 300 --arm-s
            --prearm-rms 5000.0 --arm-u --only-arms U --seed $FIRST --trials 200"
          python -B bench/bargein_replay.py $base --caller-level-db-range=-10,0 > ../cli-s1.json &
          p1=$!
          python -B bench/bargein_replay.py $base > ../cli-s0.json &
          p0=$!
          wait $p1
          wait $p0
          for c in s1 s0; do
            a=$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "../cli-$c.json")
            b=$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "../out/$c-$FIRST.meta.json")
            echo "$c-$FIRST plain $a instrumented $b" | tee -a "$GITHUB_STEP_SUMMARY" ../out/clisha.txt
            test "$a" = "$b"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cues-${{ matrix.first }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
