name: z0live barge-in arm G + Geigel-free shadow-filter stall guard, raw continuous echo, arms D / G / O (CPU, stdlib)
# A-bargein-O: this branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml
# --ref <branch>` can dispatch it (a new workflow file is not dispatchable until it is on the default branch).
# It runs voice-adapter/bench/bargein_sweep.py with --echo-model residual --echo-continuous (raw echo, NO
# --echo-erle-db) --bot-render recorded --rhos none (no arm C) --arm-d --arm-g --arm-o (bargein_replay/12,
# offline virtual-time sim, Python stdlib only, no network, no secrets) on holdout seed 61 and fresh seeds
# 12000-12039, one seed per shard, with the three conditions run as parallel processes on the runner: S0
# unstressed -> out/s0, S1 caller-only (--caller-level-db-range -10,0) -> out/s1, FULL (caller -10,0 and
# --erl-db-range 0,6) -> out/full.
# Arms A, B (always run by the sweep), D frozen (k -12 dB, M 30 ms), G = A-bargein-M's arm (NLMS canceller with the
# Geigel 0.5 double-talk freeze + residual-only gate, residual RMS >= 1360, M 30 ms, armed at monitored ERLE 6 dB),
# O = arm G plus a Geigel-free shadow NLMS filter that replaces G's filter only when G's monitored ERLE is < 6 dB
# and the shadow residual is >= 3 dB lower for 5 consecutive render-active packets (stall/divergence guard).
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        seed: [61, 12000, 12001, 12002, 12003, 12004, 12005, 12006, 12007, 12008, 12009, 12010, 12011, 12012, 12013,
               12014, 12015, 12016, 12017, 12018, 12019, 12020, 12021, 12022, 12023, 12024, 12025, 12026, 12027,
               12028, 12029, 12030, 12031, 12032, 12033, 12034, 12035, 12036, 12037, 12038, 12039]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 60
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          cd voice-adapter
          common=(--seeds "$SEED" --jobs 1 --echo-model residual --echo-continuous
                  --bot-render recorded --rhos none --arm-d --energy-k-db -12 --energy-min-speech-ms 30
                  --arm-g --resid-threshold 1360 --arm-o --guard-erle-db 6 --guard-margin-db 3 --guard-packets 5)
          t0=$(date +%s)
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s0 > ../s0.log &
          p0=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s1 --caller-level-db-range=-10,0 > ../s1.log &
          p1=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/full \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 > ../full.log &
          p2=$!
          rc=0
          wait $p0 || rc=1
          wait $p1 || rc=1
          wait $p2 || rc=1
          for c in s0 s1 full; do sed "s/^/$c /" "../$c.log" | tee -a "$GITHUB_STEP_SUMMARY"; done
          echo "sweep wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.seed }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls s0/seed-*.json s1/seed-*.json full/seed-*.json | wc -l && sha256sum s0/seed-*.json s1/seed-*.json full/seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum s0/seed-*.json s1/seed-*.json full/seed-*.json)
