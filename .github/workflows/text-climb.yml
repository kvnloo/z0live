name: z0live barge-in two-path (double-talk-robust) NLMS canceller + residual gate, raw continuous echo, arms D / G / H (CPU, stdlib)
# A-bargein-N: this branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml
# --ref <branch>` can dispatch it (a new workflow file is not dispatchable until it is on the default branch).
# It runs voice-adapter/bench/bargein_sweep.py with --echo-model residual --echo-continuous (raw echo, NO
# --echo-erle-db) --bot-render recorded --rhos none (no arm C) --arm-d --arm-g --arm-h (bargein_replay/11,
# offline virtual-time sim, Python stdlib only, no network, no secrets) on holdout seed 59 and fresh seeds
# 11000-11039, one seed per shard, with the three conditions run as parallel processes on the runner: S0
# unstressed -> out/s0, S1 caller-only (--caller-level-db-range -10,0) -> out/s1, FULL (caller -10,0 and
# --erl-db-range 0,6) -> out/full.
# Arms A, B (always run by the sweep), D frozen (k -12 dB, M 30 ms), G = A-bargein-M's arm (NLMS canceller with the
# Geigel 0.5 double-talk freeze + residual-only gate, residual RMS >= 1360, M 30 ms, armed at monitored ERLE 6 dB),
# H = the same residual-only gate after a two-path NLMS canceller (background adapts on every render-active packet,
# no Geigel freeze; the foreground copies it when its residual is >= 0.5 dB lower for 2 consecutive packets).
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        seed: [59, 11000, 11001, 11002, 11003, 11004, 11005, 11006, 11007, 11008, 11009, 11010, 11011, 11012, 11013,
               11014, 11015, 11016, 11017, 11018, 11019, 11020, 11021, 11022, 11023, 11024, 11025, 11026, 11027,
               11028, 11029, 11030, 11031, 11032, 11033, 11034, 11035, 11036, 11037, 11038, 11039]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 30
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          cd voice-adapter
          common=(--seeds "$SEED" --jobs 1 --echo-model residual --echo-continuous
                  --bot-render recorded --rhos none --arm-d --energy-k-db -12 --energy-min-speech-ms 30
                  --arm-g --resid-threshold 1360 --arm-h --twopath-copy-db 0.5 --twopath-copy-packets 2)
          t0=$(date +%s)
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s0 > ../s0.log &
          p0=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s1 --caller-level-db-range=-10,0 > ../s1.log &
          p1=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/full \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 > ../full.log &
          p2=$!
          rc=0
          wait $p0 || rc=1
          wait $p1 || rc=1
          wait $p2 || rc=1
          for c in s0 s1 full; do sed "s/^/$c /" "../$c.log" | tee -a "$GITHUB_STEP_SUMMARY"; done
          echo "sweep wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.seed }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls s0/seed-*.json s1/seed-*.json full/seed-*.json | wc -l && sha256sum s0/seed-*.json s1/seed-*.json full/seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum s0/seed-*.json s1/seed-*.json full/seed-*.json)
