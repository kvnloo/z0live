name: z0live barge-in arm S (arm Q + pre-arm speech rule), raw continuous echo, arms D / O / Q / S (CPU, stdlib)
# A-bargein-S: this branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml
# --ref <branch>` can dispatch it (a new workflow file is not dispatchable until it is on the default branch).
# It runs voice-adapter/bench/bargein_sweep.py with --echo-model residual --echo-continuous (raw echo, NO
# --echo-erle-db) --bot-render recorded --rhos none (no arm C) --arm-d --arm-o --arm-q --arm-s (bargein_replay/16,
# offline virtual-time sim, Python stdlib only, no network, no secrets) on holdout seed 68 and fresh seeds
# 17000-17039, one seed per shard, with the three conditions run as parallel processes on the runner: S0
# unstressed -> out/s0, S1 caller-only (--caller-level-db-range -10,0) -> out/s1, FULL (caller -10,0 and
# --erl-db-range 0,6) -> out/full.
# Arms A, B (always run by the sweep), D frozen (k -12 dB, M 30 ms), O = A-bargein-O's arm (NLMS canceller with the
# Geigel 0.5 freeze + Geigel-free shadow stall guard 5 pkt / 3 dB / 6 dB, residual RMS >= 1360, 30 ms onset run,
# armed at monitored ERLE 6 dB; the control), Q = arm O whose 30 ms onset only ducks (pauses) playout; the flush is
# committed after 100 ms of cumulative residual speech within 300 ms of the duck, else playout resumes
# (A-bargein-Q; reference), S = arm Q plus a pre-arm rule: while the residual gate is not yet armed, residual RMS
# >= 5000 (prearm_rms, tuned on dev seeds) also counts as speech for the onset/duck run and commit (candidate).
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        seed: [68, 17000, 17001, 17002, 17003, 17004, 17005, 17006, 17007, 17008, 17009, 17010, 17011, 17012, 17013,
               17014, 17015, 17016, 17017, 17018, 17019, 17020, 17021, 17022, 17023, 17024, 17025, 17026, 17027,
               17028, 17029, 17030, 17031, 17032, 17033, 17034, 17035, 17036, 17037, 17038, 17039]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 60
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          cd voice-adapter
          common=(--seeds "$SEED" --jobs 1 --echo-model residual --echo-continuous
                  --bot-render recorded --rhos none --arm-d --energy-k-db -12 --energy-min-speech-ms 30
                  --resid-threshold 1360 --arm-o --guard-erle-db 6 --guard-margin-db 3 --guard-packets 5
                  --arm-q --duck-commit-ms 100 --duck-window-ms 300 --arm-s --prearm-rms 5000)
          t0=$(date +%s)
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s0 > ../s0.log &
          p0=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s1 --caller-level-db-range=-10,0 > ../s1.log &
          p1=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/full \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 > ../full.log &
          p2=$!
          rc=0
          wait $p0 || rc=1
          wait $p1 || rc=1
          wait $p2 || rc=1
          for c in s0 s1 full; do sed "s/^/$c /" "../$c.log" | tee -a "$GITHUB_STEP_SUMMARY"; done
          echo "sweep wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.seed }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls s0/seed-*.json s1/seed-*.json full/seed-*.json | wc -l && sha256sum s0/seed-*.json s1/seed-*.json full/seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum s0/seed-*.json s1/seed-*.json full/seed-*.json)
