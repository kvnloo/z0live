name: z0live barge-in energy-gate stress sweep (CPU, stdlib)
# A-bargein-G: this branch reuses the registered text-climb.yml file name so `gh workflow run text-climb.yml
# --ref <branch>` can dispatch it (a new workflow file is not dispatchable until it is on the default branch).
# It runs voice-adapter/bench/bargein_sweep.py with --echo-model residual --bot-render recorded --arm-d plus
# the stress flags --caller-level-db-range -10,0 --erl-db-range 0,6 (bargein_replay/5, offline virtual-time
# sim, Python stdlib only, no network, no secrets) on holdout seed 46 and fresh seeds 4000-4039: arms A, B,
# C rho 0.9 at M 40 ms, D frozen (k -12 dB, M 30 ms, A-bargein-F pick). A second sweep (out/tuned) runs
# D-retuned k -18 M30 (least-bad on dev seed 45; descriptive only).
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seeds ${{ matrix.seeds }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seeds: ["46", 4000-4001, 4002-4003, 4004-4005, 4006-4007, 4008-4009, 4010-4011, 4012-4013, 4014-4015,
                4016-4017, 4018-4019, 4020-4021, 4022-4023, 4024-4025, 4026-4027, 4028-4029, 4030-4031,
                4032-4033, 4034-4035, 4036-4037, 4038-4039]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 36
        env:
          SEEDS: ${{ matrix.seeds }}
        run: |
          set -euo pipefail
          cd voice-adapter
          python -B bench/bargein_sweep.py --seeds "$SEEDS" --out ../out --jobs "$(nproc)" \
            --echo-model residual --bot-render recorded --rhos 0.9 \
            --arm-d --energy-k-db -12 --energy-min-speech-ms 30 \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 | tee -a "$GITHUB_STEP_SUMMARY"
          python -B bench/bargein_sweep.py --seeds "$SEEDS" --out ../out/tuned --jobs "$(nproc)" \
            --echo-model residual --bot-render recorded --rhos 0.9 \
            --arm-d --energy-k-db -18 --energy-min-speech-ms 30 \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 | sed 's/^/tuned /' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.seeds }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls seed-*.json tuned/seed-*.json | wc -l && sha256sum seed-*.json tuned/seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum seed-*.json tuned/seed-*.json)
