name: z0live barge-in A-bargein-Z, arm U vs arm Q with different-speaker caller/bot clips (--clip-set multi) on fresh seeds 34000-34095 (S1, S0, FULL; CPU, stdlib)
# A-bargein-Z: one change on the stimulus side (bargein_replay/22, offline virtual-time sim, Python stdlib only, no
# network, no secrets). --clip-set multi draws caller and bot clips from a bundled set of six LibriSpeech dev-clean
# speakers other than 2277 (three male, three female), and the bot clip's speaker always differs from the caller
# clip's. No arm, gate or constant changes. This branch reuses the registered text-climb.yml file name so
# `gh workflow run text-climb.yml --ref <branch>` can dispatch it.
# --only-arms Q,U skips the arms O and S (A and B always run); unit-tested not to change the arms that run.
# Seeds 34000-34095 (never used before), two seeds per shard (matrix value = first seed, the shard runs first..+1),
# 48 shards in seed order, so the first shards (holding the local-recompute seeds 34000 and 34002) start first.
# Three conditions per shard as parallel processes: S1 quiet caller (--caller-level-db-range -10,0) -> out/s1,
# S0 unstressed -> out/s0, FULL (S1 + --erl-db-range 0,6) -> out/full. No holdout seed in this slot.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "free-text label for this run (shown in the summary)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  sweep:
    name: seeds ${{ matrix.first }}+1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        first: [34000, 34002, 34004, 34006, 34008, 34010, 34012, 34014, 34016, 34018, 34020, 34022,
                34024, 34026, 34028, 34030, 34032, 34034, 34036, 34038, 34040, 34042, 34044, 34046,
                34048, 34050, 34052, 34054, 34056, 34058, 34060, 34062, 34064, 34066, 34068, 34070,
                34072, 34074, 34076, 34078, 34080, 34082, 34084, 34086, 34088, 34090, 34092, 34094]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "runner CPU: ${cpu:-unknown} ($(uname -m), $(nproc) cpus), $(python --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Sweep
        timeout-minutes: 55
        env:
          FIRST: ${{ matrix.first }}
        run: |
          set -euo pipefail
          cd voice-adapter
          seeds="$FIRST-$((FIRST + 1))"
          common=(--seeds "$seeds" --jobs 2 --echo-model residual --echo-continuous
                  --bot-render recorded --clip-set multi --rhos none --energy-k-db -12 --energy-min-speech-ms 30
                  --resid-threshold 1360 --arm-o --guard-erle-db 6 --guard-margin-db 3 --guard-packets 5
                  --arm-q --duck-commit-ms 100 --duck-window-ms 300 --arm-s --prearm-rms 5000 --arm-u
                  --only-arms Q,U)
          t0=$(date +%s)
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s1 --caller-level-db-range=-10,0 > ../s1.log &
          p1=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/s0 > ../s0.log &
          p0=$!
          python -B bench/bargein_sweep.py "${common[@]}" --out ../out/full \
            --caller-level-db-range=-10,0 --erl-db-range=0,6 > ../full.log &
          p2=$!
          rc=0
          wait $p1 || rc=1
          wait $p0 || rc=1
          wait $p2 || rc=1
          for c in s1 s0 full; do sed "s/^/$c /" "../$c.log" | tee -a "$GITHUB_STEP_SUMMARY"; done
          echo "sweep wall $(( $(date +%s) - t0 )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.first }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: results
          merge-multiple: true
      - name: Hashes
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          { [ -n "${NOTE}" ] && echo "note: ${NOTE}"; echo '```'; (cd results && ls s1/seed-*.json s0/seed-*.json full/seed-*.json | wc -l && sha256sum s1/seed-*.json s0/seed-*.json full/seed-*.json); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          (cd results && sha256sum s1/seed-*.json s0/seed-*.json full/seed-*.json)
