name: z0live CI

on:
  push:
    branches:
      - main
      - feat/brainstorm-session-lifecycle
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: python -m pip install -e '.[test]'

      - name: Python tests
        run: pytest -q

      - name: Replay canonical fixtures
        run: python -m z0live replay fixtures/core-v1.json

      - name: Runtime smoke
        run: python -m z0live smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check OMP plugin syntax
        run: node --check plugins/omp/index.mjs

      - name: OMP plugin unit tests
        run: node --test plugins/omp/index.test.mjs
