name: Root stdlib tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Compile root Python
        run: python -m compileall -q bin tests
      - name: Run root unittest suite
        run: python -m unittest discover -s tests -v
