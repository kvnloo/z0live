name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: z0live-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m z0live replay fixtures/core-v1.json
      - run: python -m z0live replay fixtures/stress-v1.json
      - run: python -m z0live speculation-replay fixtures/speculation-v1.json
      - run: python -m z0live smoke
      - run: python -m compileall -q src
