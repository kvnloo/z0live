[package]
name = "z0live-live-demo-v1"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.0", features = ["vulkan", "cli"] }

[workspace]

[profile.release.package.z0live-live-demo-v1]
opt-level = 1
codegen-units = 8
