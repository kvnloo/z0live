name: z0live
version: "0.2.0"
manifest_version: 1
kind: standalone
description: "z0live is a self-hosted realtime voice stack beside Hermes: GPT-Live or Grok Voice, a second voice that answers by name, and fast/medium/slow model lanes that answer while Hermes works. This repo is the plugin: tools to see and steer the stack (z0live_status, z0live_configure, z0live_lanes) and /z0live-lanes. Nothing leaves the machine."
author: "Kevin Rajan"
license: MIT
homepage: "https://github.com/kvnloo/z0live"
tags: ["voice", "realtime", "gpt-live", "grok", "lanes", "z0live"]
requires_env: []
requires_hermes: ">=0.21.5"
config_schema:
  z0live_repo: {type: str, default: "", label: "z0live checkout", description: "Checkout whose bin/z0live picks the engine; empty = this plugin's own tree"}
  lanes_file: {type: str, default: "~/.z0int/config/z0live-lanes.json", label: "Lanes config", description: "z0live.lanes.v1 file; lanes.voice.actor is the engine"}
  tiers_file: {type: str, default: "~/.config/z0live/tiers.json", label: "Lane tiers override", description: "fast/medium/slow model lists; absent = z0live defaults"}
  voices_file: {type: str, default: "~/.config/z0live/voices.json", label: "Second voice", description: "{\"guest\": \"grok\"} adds Grok to GPT-Live calls"}
  traces_dir: {type: str, default: "~/.local/share/z0live/voice-traces", label: "Call traces", description: "Per-call JSONL event traces written by the voice adapter"}
  lane_url: {type: str, default: "http://127.0.0.1:8646", label: "Lane server", description: "Loopback URL of z0live's lane_server.py"}
  meetings_state_dir: {type: str, default: "", label: "Meeting state directory", description: "Private local state; defaults to meetings/ under the active Hermes profile"}
  meetings_livekit_bin: {type: str, default: "/opt/homebrew/bin/livekit-server", label: "LiveKit binary"}
  meetings_bot_python: {type: str, default: "", label: "Meetings media Python", description: "Separate interpreter with the dependencies in meetings/requirements.txt"}
  meetings_voice_url: {type: str, default: "http://127.0.0.1:9168", label: "z0live voice adapter URL", description: "Use a dedicated development adapter for M1"}
  meetings_voice_bearer_file: {type: str, default: "", label: "Voice bearer file path", description: "Path to a private file; never put the token itself in this setting"}
  meetings_profile: {type: str, default: "", label: "Voice Hermes profile"}
  meetings_guest_asr_url: {type: str, default: "", label: "Local guest transcription URL", description: "Optional loopback LFM2.5-Audio server; no guest audio or text goes to the owner voice session"}
  meetings_meet_url: {type: str, default: "http://127.0.0.1:3000/custom", label: "Trusted LiveKit Meet custom page", description: "Use a self-hosted Meet client that is allowed to receive guest join tokens"}
provides_tools: ["z0live_status", "z0live_configure", "z0live_lanes", "meetings_start", "meetings_invite", "meetings_status", "meetings_leave"]
provides_hooks: []
